<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Race Intelligence Dashboard</title>
    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
    <script>
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <div class="logo">F1 RACE INTELLIGENCE</div>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#features">Features</a></li>
            <li><a href="#dashboard">Dashboard</a></li>
            <li><a href="#technologies">Technologies</a></li>
        </ul>
    </nav>
    <!-- Hero Section -->
    <header class="hero" id="home">
        <p class="subtitle">DATA • SPEED • STRATEGY</p>
        <h1>
            F1 Race <span>Intelligence</span>
            Dashboard
        </h1>
        <p>
            Explore Formula 1 racing through interactive data
            visualizations, driver performance, team comparisons,
            and race intelligence.
        </p>
        <a href="#dashboard" class="btn">Explore Dashboard</a>
    </header>
    <!-- About Section -->
    <section id="about">
        <h2>About the Project</h2>
        <p>
            The F1 Race Intelligence Dashboard is a data visualization
            project designed to explore Formula 1 racing data.
            It presents race-related insights through interactive
            charts and visual representations, helping users explore
            racing performance and identify patterns in the data.
        </p>
        <p>
            The project combines data analysis and visualization to
            make Formula 1 statistics easier to understand.
        </p>
    </section>
    <!-- Features Section -->
    <section id="features">
        <h2>Dashboard Features</h2>
        <p>
            Explore different aspects of Formula 1 racing through
            interactive visualizations.
        </p>
        <div class="features-container">
            <div class="card">
                <h3>🏎️ Race Analysis</h3>
                <p>
                    Explore race-related statistics and compare
                    performance across available racing data.
                </p>
            </div>
            <div class="card">
                <h3>🏆 Driver Performance</h3>
                <p>
                    Analyze driver statistics and explore
                    performance comparisons.
                </p>
            </div>
            <div class="card">
                <h3>🔧 Team Analysis</h3>
                <p>
                    Compare team performance and examine
                    differences in racing results.
                </p>
            </div>
            <div class="card">
                <h3>📊 Data Visualization</h3>
                <p>
                    Understand racing data using charts,
                    graphs, and visual comparisons.
                </p>
            </div>
            <div class="card">
                <h3>📈 Performance Trends</h3>
                <p>
                    Explore trends and patterns across the
                    data included in the dashboard.
                </p>
            </div>
            <div class="card">
                <h3>🎯 Interactive Exploration</h3>
                <p>
                    Interact with the published Tableau Story
                    to explore the available visualizations.
                </p>
            </div>
        </div>
    </section>
    <!-- Tableau Dashboard Section -->
    <section id="dashboard">
        <h2>Explore the Dashboard</h2>
        <p>
            View the interactive F1 Race Intelligence Dashboard
            created using Tableau Public.
        </p>
        <div class="dashboard-container">
            <iframe
                src="https://public.tableau.com/views/F1_RaceintelligenceDashboard/Story1?:showVizHome=no"
                title="F1 Race Intelligence Tableau Story"
                width="100%"
                height="750"
                loading="lazy"
                allowfullscreen>
            </iframe>
        </div>
        <div class="dashboard-link">
            <a
                href="https://public.tableau.com/app/profile/janhavi.bobde/viz/F1_RaceintelligenceDashboard/Story1?publish=yes"
                target="_blank"
                rel="noopener noreferrer"
                class="btn">
                Open Dashboard on Tableau Public
            </a>
        </div>
    </section>
    <!-- Technologies Section -->
    <section id="technologies">
        <h2>Tools & Technologies</h2>
        <div class="features-container">
            <div class="card">
                <h3>HTML5</h3>
                <p>
                    Used to structure the website and its content.
                </p>
            </div>
            <div class="card">
                <h3>CSS3</h3>
                <p>
                    Used to style the website and create a responsive layout.
                </p>
            </div>
            <div class="card">
                <h3>JavaScript</h3>
                <p>
                    Used to add interactive behavior to the website.
                </p>
            </div>
            <div class="card">
                <h3>Tableau Public</h3>
                <p>
                    Used to create and publish interactive data visualizations.
                </p>
            </div>
            <div class="card">
                <h3>Data Analysis</h3>
                <p>
                    Used to explore racing statistics and identify patterns.
                </p>
            </div>
            <div class="card">
                <h3>Data Visualization</h3>
                <p>
                    Used to present racing information through charts and graphs.
                </p>
            </div>
        </div>
    </section>
    <!-- Footer -->
    <footer>
        <p>F1 Race Intelligence Dashboard</p>
        <p>Data Visualization Project | Formula 1 Racing</p>
        <p>&copy; 2026 F1 Race Intelligence Dashboard</p>
    </footer>
    <!-- Connect JavaScript -->
    <script src="script.js"></script>
</body>
</html>
